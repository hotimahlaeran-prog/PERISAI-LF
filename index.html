const advocateListBlock = (advList) => {
  const numbered = advList.map((a, i) => `${i + 1}. ${(a.name || "").toUpperCase()}${a.email ? ` (e-mail: ${a.email})` : ""}`).join("\n");
  const plural = advList.length > 1;
  return `${numbered}\n${plural ? "Kesemuanya adalah" : "Adalah"} Advokat dan Konsultan Hukum pada Kantor Hukum "${FIRM_INFO.name}", berkedudukan/beralamat di ${FIRM_INFO.address}, baik secara bersama-sama maupun sendiri-sendiri,`;
};

const courtFull = (c) => `${c.court || "____"}${c.courtCity ? " " + c.courtCity : ""}`;
const opposingIdentity = (c) => ({
  name: c.opposingParty, nik: c.opposingNik, birthPlace: c.opposingBirthPlace, birthDate: c.opposingBirthDate,
  gender: c.opposingGender, religion: c.opposingReligion, occupation: c.opposingOccupation, address: c.opposingAddress, email: c.opposingEmail,
});

function buildCeraiDoc(c, cl, advList, isTalak) {
  const roleP = isTalak ? "PEMOHON" : "PENGGUGAT";
  const roleT = isTalak ? "TERMOHON" : "TERGUGAT";
  const roleTLower = isTalak ? "Termohon" : "Tergugat";
  const roleTShort = isTalak ? "Pemohon" : "Penggugat";

  const jenisSurat = isTalak ? "permohonan cerai talak" : "gugatan cerai";

    ? `Bahwa setelah menikah, ${roleTShort} dan ${roleTLower} hidup bersama sebagai suami istri dan bertempat tinggal di ${c.jointAddress || "____________"}, serta telah dikaruniai anak, yaitu:\n${c.childrenText};\n\n`

  const petitumInti = isTalak
    ? `Memberi izin kepada Pemohon (${cl.name || "____________"}) untuk menjatuhkan talak satu raj'i terhadap Termohon (${c.opposingParty || "____________"}) di hadapan sidang ${courtFull(c)};`
    : `Menyatakan perkawinan antara Penggugat (${cl.name || "____________"}) dengan Tergugat (${c.opposingParty || "____________"}) putus karena perceraian dengan segala akibat hukumnya;`;
  const advNames = advList.map((a) => `${(a.name || "").toUpperCase()}${a.email ? ` (e-mail: ${a.email})` : ""}`).filter(Boolean).join(", ");
  return `${c.courtCity || "Sampang"}, ${fmtDate(todayISO())}
Kepada Yth.
Ketua ${courtFull(c)}
di–
Tempat

Perihal   : ${perihal}
Lampiran  : 1 (satu) bendel

Assalamu'alaikum Warahmatullahi Wabarakatuh,

Yang bertanda tangan di bawah ini:

${advNames || "____________"}. ${advList.length > 1 ? "Kesemuanya adalah" : "Adalah"} Advokat dan Konsultan Hukum pada Kantor Hukum "${FIRM_INFO.name}", beralamat di ${FIRM_INFO.address}, berdasarkan Surat Kuasa Khusus tertanggal ${fmtDate(c.kuasaDate) !== "-" ? fmtDate(c.kuasaDate) : "____________"}, bertindak untuk dan atas nama serta guna kepentingan hukum klien kami tersebut di bawah ini:

${idInline(cl)}, untuk selanjutnya disebut sebagai ____________________${roleP};

Dengan ini ${roleTShort} mengajukan ${jenisSurat} terhadap:

${idInline(opposingIdentity(c))}, untuk selanjutnya disebut sebagai --${roleT};

${roleTShort} dengan ini menguraikan dalil-dalil/posita ${isTalak ? "permohonan" : "gugatan"} sebagai berikut:

DUDUK PERKARA

Bahwa ${roleTShort} dan ${roleTLower} adalah suami istri yang menikah secara sah pada ${fmtDate(c.marriageDate) !== "-" ? fmtDate(c.marriageDate) : "____________"}, sebagaimana tercatat dalam Kutipan Akta Nikah Nomor ${c.marriageActNumber || "____________"} yang dikeluarkan oleh ${c.marriageKUA || "Kantor Urusan Agama (KUA) setempat"};

${anak}Bahwa rumah tangga ${roleTShort} dan ${roleTLower} pada awalnya berjalan rukun dan harmonis sebagaimana layaknya kehidupan suami istri;

Bahwa sejak sekitar ${c.disputeYear || "____________"}, rumah tangga ${roleTShort} dan ${roleTLower} mulai diwarnai perselisihan dan pertengkaran yang disebabkan oleh ${c.disputeCause || "____________"};

Bahwa ${c.separationInfo || "sejak saat itu hingga " + jenisSurat + " ini diajukan, kedua belah pihak telah hidup berpisah tempat tinggal dan tidak lagi melaksanakan hak serta kewajiban sebagai suami istri"}, sehingga rumah tangga ${roleTShort} dan ${roleTLower} secara nyata telah pecah (broken marriage);

Bahwa segala upaya perdamaian baik oleh ${roleTShort} maupun keluarga kedua belah pihak telah ditempuh, namun tidak membuahkan hasil;

Bahwa dengan telah berpisahnya tempat tinggal, tidak terlaksananya hak dan kewajiban suami istri, serta gagalnya upaya perdamaian, tujuan perkawinan untuk membentuk keluarga yang bahagia dan kekal sudah tidak dapat lagi diwujudkan, sehingga telah memenuhi unsur-unsur ketentuan Pasal 39 ayat (2) Undang-Undang Nomor 1 Tahun 1974 jo. Pasal 19 huruf f Peraturan Pemerintah Nomor 9 Tahun 1975 jo. Pasal 116 huruf f Kompilasi Hukum Islam, sehingga ${jenisSurat} a quo beralasan hukum untuk dikabulkan;

Berdasarkan seluruh uraian fakta dan dasar hukum tersebut di atas, ${roleTShort} melalui kuasa hukumnya memohon kepada Ketua ${courtFull(c)} cq. Majelis Hakim yang memeriksa dan mengadili perkara a quo, untuk berkenan memberikan putusan sebagai berikut:

PETITUM

Mengabulkan ${isTalak ? "permohonan" : "gugatan"} ${roleTShort} untuk seluruhnya;
${petitumInti}
Membebankan biaya perkara menurut hukum yang berlaku;
Atau apabila ${courtFull(c)} berpendapat lain, mohon putusan yang seadil-adilnya (ex aequo et bono).

Demikian ${isTalak ? "permohonan" : "gugatan"} ini kami ajukan, atas perkenan dan dikabulkannya permohonan ini kami sampaikan terima kasih.

Wassalamu'alaikum Warahmatullahi Wabarakatuh.

Hormat kami,
Kuasa Hukum ${roleTShort},

${advList.map((a) => (a.name || "____________")).join("\t\t")}`;
}

const TEMPLATES = {

Kuasa ini diberikan dengan hak substitusi, baik sebagian maupun seluruhnya, kepada pihak lain apabila dipandang perlu oleh Penerima Kuasa.

Demikian Surat Kuasa Khusus ini dibuat dengan sebenarnya untuk dapat dipergunakan sebagaimana mestinya.

${c.courtCity || "Sampang"}, ${fmtDate(todayISO())}

Penerima Kuasa                                    Pemberi Kuasa



(${(advList[0] && advList[0].name) || "_________________"})                               (${cl.name || "____________"})`;
    },
  },
  ceraiTalak: {
    label: "Permohonan Cerai Talak",
    courts: ["Pengadilan Agama"],
    familySubtype: "Cerai Talak",
    build: (c, cl, advList) => buildCeraiDoc(c, cl, advList, true),

I. TENTANG DUDUK PERKARA
1. [ringkas dalil gugatan/permohonan];

Sampang, ${fmtDate(todayISO())}

Kuasa Hukum ${cl.name || "____________"}`,

Dengan hormat,

${idInline(cl)}

Untuk selanjutnya disebut sebagai --------------------------------------------- PELAWAN

Nama    : ${c.opposingParty || "____________"}

function useStore(key, initial) {
  const [data, setData] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch (e) { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }, [data, key]);
  return [data, setData];
}

function Ico({ children, size = 16, className = "" }) {
  return <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block" }}>{children}</span>;
}
const IcoStamp = (p) => <Ico {...p}>🏛</Ico>;
const IcoUsers = (p) => <Ico {...p}>👥</Ico>;
const IcoFile = (p) => <Ico {...p}>📄</Ico>;
const IcoCal = (p) => <Ico {...p}>📅</Ico>;
const IcoDash = (p) => <Ico {...p}>📊</Ico>;
const IcoBook = (p) => <Ico {...p}>📖</Ico>;
const IcoMega = (p) => <Ico {...p}>📣</Ico>;
const IcoWallet = (p) => <Ico {...p}>💼</Ico>;
const IcoPlus = (p) => <Ico {...p}>＋</Ico>;
const IcoX = (p) => <Ico {...p}>✕</Ico>;
const IcoWarn = (p) => <Ico {...p}>⚠</Ico>;
const IcoChevron = (p) => <Ico {...p}>›</Ico>;
const IcoSearch = (p) => <Ico {...p}>🔍</Ico>;
const IcoPen = (p) => <Ico {...p}>✎</Ico>;
const IcoLink = (p) => <Ico {...p}>↗</Ico>;
const IcoTrash = (p) => <Ico {...p}>🗑</Ico>;
const IcoUpload = (p) => <Ico {...p}>⬆</Ico>;

function Badge({ children, tone = "default" }) {
  const tones = {
    default: "bg-[#EDE7D9] text-[#3A3226]",
    urgent: "bg-[#7A2331] text-[#F7F1E6]",
    warn: "bg-[#A8763E] text-[#F7F1E6]",
    ok: "bg-[#2F4B3C] text-[#F7F1E6]",
  };
  return <span className={`px-2 py-0.5 rounded-sm text-xs font-medium tracking-wide ${tones[tone]}`}>{children}</span>;
}

function Modal({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 bg-black/40 flex items-end md:items-center justify-center z-50" onClick={onClose}>
      <div
        className="bg-[#F7F4EC] w-full md:max-w-lg md:w-full max-h-[90vh] overflow-y-auto rounded-t-2xl md:rounded-sm shadow-2xl border border-[#D9CFB8] modal-sheet"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex justify-center pt-2 pb-1 md:hidden">
          <div className="w-10 h-1 rounded-full bg-[#D9CFB8]"></div>
        </div>
        <div className="flex items-center justify-between px-5 py-3 md:py-4 border-b border-[#D9CFB8]">

          <button onClick={onClose} className="text-[#6B6252] hover:text-[#1B2A4A] p-1"><IcoX size={20} /></button>

function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <span className="block text-xs uppercase tracking-wider text-[#6B6252] mb-1">{label}</span>
      {children}
    </label>

}

function MiniBars({ data, color }) {
  const max = Math.max(1, ...data.map((d) => d.kasus));
  return (
    <div className="space-y-2">
      {data.map((d) => (
        <div key={d.name} className="flex items-center gap-2 text-xs sans">
          <div className="w-24 truncate text-[#6B6252]">{d.name}</div>
          <div className="flex-1 bg-[#EDE7D9] rounded-sm h-3 overflow-hidden">
            <div className="h-3 rounded-sm" style={{ width: `${(d.kasus / max) * 100}%`, background: color }}></div>
          </div>
          <div className="w-5 text-right text-[#1B2A4A] font-semibold">{d.kasus}</div>
        </div>
      ))}
    </div>
  );
}

        if (!hay.includes(q)) return null;
        let snippet = "";
        if (r.content) {
          const idx = r.content.toLowerCase().indexOf(q);
          if (idx >= 0) {
            const start = Math.max(0, idx - 80);
            const end = Math.min(r.content.length, idx + q.length + 200);
            snippet = (start > 0 ? "…" : "") + r.content.slice(start, end) + (end < r.content.length ? "…" : "");

        return { ...r, snippet };

          }}>
            <Field label="Nama Lengkap"><input required name="name" className={inputCls} /></Field>
            <Field label="NIK"><input name="nik" className={inputCls} maxLength={16} placeholder="16 digit sesuai KTP" /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Tempat Lahir"><input name="birthPlace" className={inputCls} /></Field>
              <Field label="Tanggal Lahir"><input type="date" name="birthDate" className={inputCls} /></Field>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Jenis Kelamin"><select name="gender" className={inputCls}>{GENDERS.map((g) => <option key={g}>{g}</option>)}</select></Field>
              <Field label="Agama"><input name="religion" className={inputCls} placeholder="mis. Islam" /></Field>
            </div>
            <Field label="Pekerjaan"><input name="occupation" className={inputCls} /></Field>
            <Field label="Alamat Lengkap (sesuai KTP)"><textarea name="address" rows={2} className={inputCls} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="No. HP"><input name="phone" className={inputCls} /></Field>
              <Field label="Alamat Elektronik (Email)"><input type="email" name="email" className={inputCls} placeholder="untuk domisili elektronik" /></Field>
            </div>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Klien</button>
          </form>
        </Modal>
      )}

      {showCaseForm && (
        <Modal title="Kasus Baru" onClose={() => setShowCaseForm(false)}>
          <form className="sans" onSubmit={(e) => {
            e.preventDefault(); const f = new FormData(e.target);
            addCase({
              caseNumber: f.get("caseNumber"), clientId: f.get("clientId"),
              opposingParty: f.get("opposingParty"), opposingNik: f.get("opposingNik"), opposingBirthPlace: f.get("opposingBirthPlace"), opposingBirthDate: f.get("opposingBirthDate"),
              opposingGender: f.get("opposingGender"), opposingReligion: f.get("opposingReligion"), opposingOccupation: f.get("opposingOccupation"), opposingAddress: f.get("opposingAddress"), opposingEmail: f.get("opposingEmail"), opposingPhone: f.get("opposingPhone"),
              court: f.get("court"), courtCity: f.get("courtCity"), legalArea: f.get("legalArea"), familySubtype: f.get("familySubtype"),
              stage: f.get("stage"), urgency: f.get("urgency"), advocateId: f.get("advocateId"), coAdvocates: f.getAll("coAdvocates"),
              kuasaDate: f.get("kuasaDate"), marriageDate: f.get("marriageDate"), marriageActNumber: f.get("marriageActNumber"), marriageKUA: f.get("marriageKUA"),
              jointAddress: f.get("jointAddress"), childrenText: f.get("childrenText"), disputeYear: f.get("disputeYear"), disputeCause: f.get("disputeCause"), separationInfo: f.get("separationInfo"),
            });
          }}>
            <Field label="Nomor Perkara"><input required name="caseNumber" className={inputCls} placeholder="mis. 123/Pdt.G/2026/PA.Spg" /></Field>
            <Field label="Klien"><select required name="clientId" className={inputCls}><option value="">— pilih klien —</option>{clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>

            <div className="border-t border-[#D9CFB8] my-3 pt-3">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Identitas Pihak Lawan</p>
              <Field label="Nama Pihak Lawan"><input name="opposingParty" className={inputCls} placeholder="Tergugat/Termohon/Pihak Lawan" /></Field>
              <Field label="NIK"><input name="opposingNik" className={inputCls} maxLength={16} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Tempat Lahir"><input name="opposingBirthPlace" className={inputCls} /></Field>
                <Field label="Tanggal Lahir"><input type="date" name="opposingBirthDate" className={inputCls} /></Field>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Jenis Kelamin"><select name="opposingGender" className={inputCls}>{GENDERS.map((g) => <option key={g}>{g}</option>)}</select></Field>
                <Field label="Agama"><input name="opposingReligion" className={inputCls} placeholder="mis. Islam" /></Field>
              </div>
              <Field label="Pekerjaan"><input name="opposingOccupation" className={inputCls} /></Field>
              <Field label="Alamat Lengkap"><textarea name="opposingAddress" rows={2} className={inputCls} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="No. HP/WhatsApp (opsional)"><input name="opposingPhone" className={inputCls} /></Field>
                <Field label="Alamat Elektronik (Email, opsional)"><input type="email" name="opposingEmail" className={inputCls} /></Field>
              </div>
            </div>

            <div className="border-t border-[#D9CFB8] my-3 pt-3">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Forum & Klasifikasi</p>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Jenis Pengadilan"><select name="court" className={inputCls}>{COURT_TYPES.map((c) => <option key={c}>{c}</option>)}</select></Field>
                <Field label="Kota/Kabupaten"><input name="courtCity" className={inputCls} placeholder="mis. Sampang" defaultValue="Sampang" /></Field>
              </div>
              <Field label="Bidang Hukum">
                <select name="legalArea" className={inputCls} value={caseLegalAreaSel} onChange={(e) => setCaseLegalAreaSel(e.target.value)}>
                  {LEGAL_AREAS.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              {caseLegalAreaSel === "Keluarga" && (
                <Field label="Jenis Perkara Keluarga"><select name="familySubtype" className={inputCls}>{FAMILY_SUBTYPES.map((c) => <option key={c}>{c}</option>)}</select></Field>
              )}
              <Field label="Tahapan"><select name="stage" className={inputCls}>{STAGES.map((c) => <option key={c}>{c}</option>)}</select></Field>
              <Field label="Urgensi"><select name="urgency" className={inputCls}>{URGENCY.map((c) => <option key={c}>{c}</option>)}</select></Field>
            </div>

            <div className="border-t border-[#D9CFB8] my-3 pt-3">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Tim Advokat</p>
              <Field label="Advokat Penanggung Jawab (Utama)"><select name="advocateId" className={inputCls} defaultValue={activeAdvocate}>{ADVOCATES.map((a) => <option key={a}>{a}</option>)}</select></Field>
              <label className="block text-xs uppercase tracking-wider text-[#6B6252] mb-1">Advokat Pembantu (opsional, bisa pilih lebih dari satu)</label>
              <div className="grid grid-cols-2 gap-1 mb-3">
                {ADVOCATES.filter((a) => a !== "Anda").map((a) => (
                  <label key={a} className="flex items-center gap-2 text-sm text-[#3A3226]">
                    <input type="checkbox" name="coAdvocates" value={a} /> {a}
                  </label>
                ))}
              </div>
            </div>

            {caseLegalAreaSel === "Keluarga" && (
              <div className="border-t border-[#D9CFB8] my-3 pt-3">
                <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Detail Perkawinan & Anak (untuk perkara cerai)</p>
                <Field label="Tanggal Surat Kuasa Khusus"><input type="date" name="kuasaDate" className={inputCls} /></Field>
                <Field label="Tanggal Menikah"><input type="date" name="marriageDate" className={inputCls} /></Field>
                <Field label="Nomor Akta Nikah"><input name="marriageActNumber" className={inputCls} placeholder="mis. 0778/178/VIII/2013" /></Field>
                <Field label="KUA Penerbit"><input name="marriageKUA" className={inputCls} placeholder="mis. KUA Kecamatan Camplong, Kabupaten Sampang" /></Field>
                <Field label="Alamat Tempat Tinggal Bersama"><textarea name="jointAddress" rows={2} className={inputCls} /></Field>
                <Field label="Data Anak (kosongkan bila belum ada)"><textarea name="childrenText" rows={2} className={inputCls} placeholder="mis. 1. Nama, perempuan, lahir di Sampang, 24 Juni 2014" /></Field>
                <Field label="Sejak Tahun Berselisih"><input name="disputeYear" className={inputCls} placeholder="mis. 2021" /></Field>
                <Field label="Sebab Perselisihan"><textarea name="disputeCause" rows={2} className={inputCls} placeholder="mis. kondisi ekonomi tidak stabil, sering bertengkar..." /></Field>
                <Field label="Kondisi Perpisahan"><textarea name="separationInfo" rows={2} className={inputCls} placeholder="mis. sejak Juli 2025 berpisah tempat tinggal selama 1 tahun" /></Field>
              </div>
            )}

            {clients.length === 0 && <p className="text-xs text-[#7A2331] mb-2">Tambahkan klien terlebih dahulu.</p>}
            <button disabled={clients.length === 0} className={`w-full mt-2 disabled:opacity-40 ${btnPrimary}`}>Simpan Kasus</button>
          </form>
        </Modal>
      )}

      {conflictWarning && (
        <Modal title="Potensi Konflik Kepentingan" onClose={() => setConflictWarning(null)}>
          <div className="sans text-sm">
            <div className="flex items-start gap-2 bg-[#F7ECEC] border border-[#7A2331]/30 rounded-sm p-3 mb-4">
              <IcoWarn size={18} className="text-[#7A2331] flex-shrink-0 mt-0.5" />
              <p className="text-[#5C1A24]">Nama yang tercatat di kasus ini juga muncul pada perkara <span className="mono font-semibold">{conflictWarning.conflict.caseNumber}</span>, kemungkinan sebagai pihak berbeda. Periksa dahulu sebelum melanjutkan.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setConflictWarning(null)} className={`flex-1 ${btnOutline}`}>Batalkan</button>
              <button onClick={confirmDespiteConflict} className="flex-1 bg-[#7A2331] text-white py-2 rounded-sm text-sm hover:bg-[#651c27]">Lanjutkan Tetap</button>
            </div>
          </div>
        </Modal>
      )}

      {showDeadlineForm && (
        <Modal title="Tenggat Baru" onClose={() => setShowDeadlineForm(false)}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addDeadline({ title: f.get("title"), dueDate: f.get("dueDate"), caseId: f.get("caseId") }); }}>
            <Field label="Judul Tenggat"><input required name="title" className={inputCls} placeholder="mis. Batas keberatan administratif" /></Field>
            <Field label="Tanggal"><input required type="date" name="dueDate" className={inputCls} /></Field>
            <Field label="Kaitkan dengan Kasus (opsional)"><select name="caseId" className={inputCls}><option value="">— umum —</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Tenggat</button>
          </form>
        </Modal>
      )}

      {showRefForm && (
        <Modal title="Referensi Hukum Baru" onClose={() => { setShowRefForm(false); setRefContent(""); setRefFileName(""); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addReference({ title: f.get("title"), category: f.get("category"), url: f.get("url"), notes: f.get("notes"), caseId: f.get("caseId"), content: refContent }); }}>
            <Field label="Judul/Nomor Peraturan"><input required name="title" className={inputCls} placeholder="mis. SEMA No. 3 Tahun 2023" /></Field>
            <Field label="Kategori"><select name="category" className={inputCls}>{REF_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</select></Field>
            <Field label="Tautan Sumber Resmi"><input name="url" className={inputCls} placeholder="https://peraturan.bpk.go.id/…" /></Field>
            <Field label="Catatan Analisis"><textarea name="notes" rows={3} className={inputCls} /></Field>
            <Field label="Kaitkan dengan Kasus (opsional)"><select name="caseId" className={inputCls}><option value="">—</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>

            <div className="border-t border-[#D9CFB8] my-3 pt-3">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Isi Lengkap Pasal/Peraturan (opsional)</p>
              <label className="flex items-center justify-center gap-2 px-3 py-3 border-2 border-dashed border-[#D9CFB8] rounded-sm cursor-pointer hover:border-[#A8763E] text-sm text-[#6B6252] mb-3">
                <IcoUpload size={16} />
                {refUploading ? "Membaca file…" : refFileName ? `Terunggah: ${refFileName}` : "Upload file .txt atau .docx"}
                <input type="file" accept=".txt,.docx" className="hidden" onChange={(e) => handleRefFileUpload(e.target.files?.[0])} />
              </label>
              <Field label="atau tempel/edit teks manual di sini">
                <textarea value={refContent} onChange={(e) => setRefContent(e.target.value)} rows={5} className={inputCls} placeholder="Tempel isi lengkap pasal/peraturan di sini…" />
              </Field>
              <p className="text-xs text-[#6B6252]">Isi ini yang membuat pencarian di kotak "Cari Pasal" bisa langsung menampilkan cuplikan pasalnya, tanpa perlu buka situs lain lagi.</p>
            </div>

            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Referensi</button>
          </form>
        </Modal>
      )}

      {showActForm && (
        <Modal title="Kegiatan Baru" onClose={() => setShowActForm(false)}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addActivity({ title: f.get("title"), type: f.get("type"), date: f.get("date"), location: f.get("location") }); }}>
            <Field label="Nama Kegiatan"><input required name="title" className={inputCls} placeholder="mis. Sampang Kabupaten Ramah Anak" /></Field>
            <Field label="Jenis"><select name="type" className={inputCls}>{ACTIVITY_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
            <Field label="Tanggal"><input required type="date" name="date" className={inputCls} /></Field>
            <Field label="Lokasi"><input name="location" className={inputCls} /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Kegiatan</button>
          </form>
        </Modal>
      )}

      {showTimeForm && (
        <Modal title="Catatan Waktu Kerja" onClose={() => setShowTimeForm(false)}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addTimeEntry({ caseId: f.get("caseId"), description: f.get("description"), hours: Number(f.get("hours")), rate: Number(f.get("rate")), date: todayISO() }); }}>
            <Field label="Kasus"><select required name="caseId" className={inputCls}><option value="">— pilih kasus —</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>
            <Field label="Deskripsi Pekerjaan"><input required name="description" className={inputCls} placeholder="mis. Penyusunan gugatan" /></Field>
            <Field label="Jumlah Jam"><input required type="number" step="0.5" name="hours" className={inputCls} /></Field>
            <Field label="Tarif per Jam (Rp)"><input required type="number" name="rate" className={inputCls} /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan</button>
          </form>
        </Modal>
      )}

      {showProfileForm && (
        <Modal title="Kelola Kontak & Email Advokat" onClose={() => setShowProfileForm(false)}>
          <form className="sans" onSubmit={(e) => {
            e.preventDefault(); const f = new FormData(e.target);
            const name = f.get("advocateName");
            setAdvocateProfiles((prev) => ({ ...prev, [name]: { birth: f.get("birth"), address: f.get("address"), noAdvokat: f.get("noAdvokat"), email: f.get("email") } }));
            setShowProfileForm(false);
          }}>
            <Field label="Pilih Advokat">
              <select name="advocateName" className={inputCls} value={editAdvocateName} onChange={(e) => setEditAdvocateName(e.target.value)}>
                {ADVOCATES.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
            <Field label="Alamat Elektronik (Email) — khusus advokat ini">
              <input type="email" name="email" defaultValue={advocateInfo(editAdvocateName).email} className={inputCls} placeholder="mis. namaadvokat@gmail.com" />
            </Field>
            <Field label="Tempat, Tanggal Lahir"><input name="birth" defaultValue={advocateInfo(editAdvocateName).birth} className={inputCls} placeholder="mis. Sampang, 01-01-1999" /></Field>
            <Field label="Alamat Pribadi"><textarea name="address" defaultValue={advocateInfo(editAdvocateName).address} rows={2} className={inputCls} /></Field>
            <Field label="Nomor Induk Advokat"><input name="noAdvokat" defaultValue={advocateInfo(editAdvocateName).noAdvokat} className={inputCls} /></Field>
            <p className="text-xs text-[#6B6252] mb-2">Setiap advokat punya email masing-masing yang tersimpan terpisah. Alamat kantor (Perisai Law Firm) tetap sama untuk semua dan tidak perlu diisi di sini.</p>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Kontak</button>
          </form>
        </Modal>
      )}

      {showLedgerForm && (
        <Modal title="Catatan Dana Klien" onClose={() => setShowLedgerForm(false)}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addLedgerEntry({ clientId: f.get("clientId"), type: f.get("type"), amount: Number(f.get("amount")), note: f.get("note"), date: todayISO() }); }}>
            <Field label="Klien"><select required name="clientId" className={inputCls}><option value="">— pilih klien —</option>{clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
            <Field label="Jenis"><select name="type" className={inputCls}><option>Setoran</option><option>Pengeluaran</option></select></Field>
            <Field label="Jumlah (Rp)"><input required type="number" name="amount" className={inputCls} /></Field>
            <Field label="Keterangan"><input name="note" className={inputCls} placeholder="mis. Biaya pendaftaran perkara" /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan</button>
          </form>
        </Modal>
      )}

      {copyToast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#1B2A4A] text-white text-sm px-4 py-2 rounded-sm shadow-lg sans z-50">
          Teks disalin ke clipboard
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
